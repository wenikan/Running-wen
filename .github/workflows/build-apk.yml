name: Build APK

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-configuration-cache \
            --warning-mode none \
            2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "========== COMPILE ERRORS =========="
            grep -n "\.java:[0-9]*: error:\|error: cannot find symbol\|error: package\|symbol:\|location:\|Caused by:\|What went wrong:" /tmp/build.log | head -80
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyWEN-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
